name: Deploy to Cloudflare Pages (Auto on Push)

# 自动部署：每次推送到 main / master 分支（或手动触发）时，
# 构建 Next.js 应用（@cloudflare/next-on-pages）并部署到 Cloudflare Pages。
#
# 必须在 GitHub 仓库 Settings → Secrets and variables → Actions 中配置：
#   CLOUDFLARE_API_TOKEN  — Cloudflare API Token（需 Pages:Edit 权限）
#   ENCRYPTION_KEY        — 加密密钥（与本地 .env 一致，32 位）
#   ADMIN_SECRET            — 管理界面登录密码（可选，留空则开放模式）
#
# 可选环境变量（workflow_dispatch 手动触发时可输入）：
#   PROJECT_NAME   — Pages 项目名（默认 affiliate-ai-hub）
#
# 可选 secret（提升体验，非必填）：
#   GH_TOKEN  — GitHub PAT（需 repo + actions/workflow 权限）。
#               配置后:① 写入 Pages 作为 GITHUB_TOKEN,提升数据接口 GitHub API 限流;
#                       ② AI 选品按钮可通过它触发 daily-picker.yml。
# 部署时 wrangler 会把以下运行变量写入 Pages 项目(凭证管理面板需要):
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_PAGES_PROJECT

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Pages 项目名称'
        required: false
        default: 'affiliate-ai-hub'
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'production' || '' }}
    env:
      # 优先使用 API Token（细粒度，推荐）；fallback 到 Global API Key + Email
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
      # 可选:GitHub PAT(需 repo/actions 权限)。若配置,会写入 Pages 作为 GITHUB_TOKEN,
      # 用于提升 GitHub API 限流 + AI选品按钮触发 daily-picker 工作流。
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            ./package-lock.json

      - name: Install wrangler
        shell: bash
        run: npm install -g wrangler

      - name: Verify required secrets
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN secret."
            exit 1
          fi
          if [ -z "$ENCRYPTION_KEY" ]; then
            echo "::error::Missing ENCRYPTION_KEY secret."
            exit 1
          fi
          echo "✓ Required secrets present."

      - name: Resolve Cloudflare Account ID
        shell: bash
        run: |
          ACCOUNT_ID=$(wrangler whoami 2>/dev/null | grep -oE '[0-9a-f]{32}' | head -1 || echo "")
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::Could not resolve Cloudflare Account ID. Check your API token has the 'User Details: Read' permission."
            exit 1
          fi
          echo "Resolved Account ID: $ACCOUNT_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV

      - name: Resolve project name
        shell: bash
        run: |
          PROJECT_NAME="${{ inputs.project_name || 'affiliate-ai-hub' }}"
          echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV
          echo "Resolved: project=$PROJECT_NAME"

      - name: Copy .data to public/data (deploy data with site)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/data
          # 用 rsync/cp 把 .data 全部数据复制到 public/data,随站点部署。
          # 这样 /data/* 路径直接命中静态文件,不依赖 GitHub API,无限流。
          cp -r .data/. public/data/
          echo "✓ Copied $(find public/data -type f | wc -l) data files to public/data/"
          echo "=== sample ==="
          ls public/data/ | head -5

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Build Next.js
        shell: bash
        run: npm run build
        env:
          NEXT_PUBLIC_GIT_REPO: ${{ github.repository }}
          NEXT_PUBLIC_DATA_URL: https://raw.githubusercontent.com/${{ github.repository }}/main

      - name: Build for Cloudflare Pages
        shell: bash
        run: npx @cloudflare/next-on-pages@1

      - name: Route /data/* to static files (bypass worker)
        shell: bash
        run: |
          set -euo pipefail
          ROUTES=".vercel/output/static/_routes.json"
          if [ -f "$ROUTES" ]; then
            # 把 /data/* 加入 exclude,使其绕过 worker 直接命中静态文件(更快、无 GitHub API 依赖)。
            # 使用 python3 或 node 修改 JSON,避免 jq 依赖。
            if command -v node >/dev/null 2>&1; then
              node -e '
                const fs = require("fs");
                const p = ".vercel/output/static/_routes.json";
                const data = JSON.parse(fs.readFileSync(p, "utf8"));
                if (!data.exclude.includes("/data/*")) data.exclude.push("/data/*");
                fs.writeFileSync(p, JSON.stringify(data));
                console.log("routes.json exclude:", data.exclude.join(","));
              '
            else
              echo "::error::node not found — cannot route /data/* to static"
              exit 1
            fi
          else
            echo "::warning::_routes.json not found — cannot route /data/* to static"
          fi

      - name: Verify build output
        shell: bash
        run: |
          # @cloudflare/next-on-pages 输出到 .vercel/output/static
          if [ ! -d ".vercel/output/static" ]; then
            echo "::error::Build output .vercel/output/static not found — build failed."
            echo "=== .vercel/output/static contents (if any) ==="
            ls -la .vercel/output/static/ 2>/dev/null || echo "(no output directory at all)"
            echo "=== cwd contents ==="
            ls -la | head -30
            exit 1
          fi
          echo "✓ Build output verified: .vercel/output/static exists"
          ls -la .vercel/output/static/ | head -20

      - name: Create Pages project if not exists
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Cloudflare auth check (wrangler whoami) ==="
          wrangler whoami 2>&1 || true

          # 用 awk 取项目列表第一列做精确匹配,避免 grep -qF 子串匹配误判
          # (例如 "affiliate-ai-hub" 会被 "cloudflare-affiliate-ai-hub" 误匹配而跳过创建)
          if wrangler pages project list 2>&1 | awk -v name="$PROJECT_NAME" '$2 == name { found=1 } END { exit !found }'; then
            echo "Pages project '$PROJECT_NAME' already exists, skipping creation"
          else
            echo "Project '$PROJECT_NAME' does not exist, creating with wrangler..."
            wrangler pages project create "$PROJECT_NAME" --production-branch main
            echo "Created Pages project '$PROJECT_NAME'"

            # 验证创建成功（确认项目已进入列表,同样用精确匹配）
            if wrangler pages project list 2>&1 | awk -v name="$PROJECT_NAME" '$2 == name { found=1 } END { exit !found }'; then
              echo "Verification passed: project '$PROJECT_NAME' now exists"
            else
              echo "::error::wrangler pages project create 执行完毕但项目仍未出现在列表中"
              echo "::error::可能原因: API Token 缺少 Cloudflare Pages:Edit 权限,或账号 ID 无法解析"
              exit 1
            fi
          fi

      - name: Configure secrets on Pages project
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Target project: $PROJECT_NAME ==="
          wrangler pages project list 2>&1 | grep -qF "$PROJECT_NAME" || {
            echo "::error::Pages project '$PROJECT_NAME' not found — run 'Create Pages project' step first."
            exit 1
          }

          # ── 业务 secrets (加密密钥 + 管理密码) ──
          printf '%s' "$ENCRYPTION_KEY" | wrangler pages secret put ENCRYPTION_KEY --project-name "$PROJECT_NAME"
          if [ -n "$ADMIN_SECRET" ]; then
            printf '%s' "$ADMIN_SECRET" | wrangler pages secret put ADMIN_SECRET --project-name "$PROJECT_NAME"
          fi

          # ── Cloudflare 运行变量 (凭证管理面板需要) ──
          # 写入后,凭证面板检测到 CLOUDFLARE_* 齐全即可通过 CF API 写入业务凭证。
          # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_PAGES_PROJECT
          # 均为运行时环境变量,允许 Web 端调用 Cloudflare REST API。
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty — cannot write runtime env."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is empty — cannot write runtime env."
            exit 1
          fi

          # 用 wrangler pages secret put 写入 (Pages 将 secret 作为运行时 env 注入)
          printf '%s' "$CLOUDFLARE_API_TOKEN" | wrangler pages secret put CLOUDFLARE_API_TOKEN --project-name "$PROJECT_NAME"
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | wrangler pages secret put CLOUDFLARE_ACCOUNT_ID --project-name "$PROJECT_NAME"
          printf '%s' "$PROJECT_NAME" | wrangler pages secret put CLOUDFLARE_PAGES_PROJECT --project-name "$PROJECT_NAME"

          # GITHUB_TOKEN (可选):若仓库配置了 GH_TOKEN,写入以提升 GitHub API 限流
          if [ -n "$GH_TOKEN" ]; then
            printf '%s' "$GH_TOKEN" | wrangler pages secret put GITHUB_TOKEN --project-name "$PROJECT_NAME"
            echo "✓ GITHUB_TOKEN written (from GH_TOKEN secret)"
          fi

          echo "✓ Secrets configured"

      - name: Deploy to Cloudflare Pages
        shell: bash
        run: |
          wrangler pages deploy .vercel/output/static --project-name "$PROJECT_NAME" --branch main --commit-dirty

          # Resolve the real *.pages.dev subdomain via the CF API
          PROJECT_DETAILS=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          RAW_SUBDOMAIN=$(echo "$PROJECT_DETAILS" | jq -r '.result.subdomain // empty' | tr -d '\r\n')
          DEPLOY_URL="https://${RAW_SUBDOMAIN:-$PROJECT_NAME}.pages.dev"
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV
          echo "::notice::Deployment URL: $DEPLOY_URL"

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          echo "## Cloudflare Pages 自动部署 ${{ job.status == 'success' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 配置项 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Pages 项目 | $PROJECT_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| 触发分支 | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 触发方式 | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 访问地址 | ${{ env.DEPLOY_URL || '(部署失败)' }} |" >> $GITHUB_STEP_SUMMARY
