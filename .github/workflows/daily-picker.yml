name: Daily Affiliate AI Picker

# NOTE: 本工作流只有一个 job `pick`。
#   1. schedule / repository_dispatch / workflow_dispatch 触发
#   2. 生成 .data/*.json 并 commit + push 到 main
#   3. **在同一 job 内直接部署到 Cloudflare Pages**(步骤从
#      pages-deploy.yml 完整复制), 不再需要跨 workflow 的 GH_TOKEN dispatch。
#
# 为什么内联部署而不是另起 deploy job?
#   - 数据已在工作区 (.data/), 直接复用, 无需 checkout 拉取
#   - GitHub Actions 中同一 workflow 的 job 共享触发时的 SHA, 独立 job
#     的 checkout 不会包含 pick 刚 push 的 commit, 必须 git pull, 复杂且易错
#
# 必须配置的 repo Secrets:
#   CLOUDFLARE_API_TOKEN  — Cloudflare API Token (Pages:Edit 权限)
#   ENCRYPTION_KEY        — 加密密钥 (与本地 .env 一致, 32 位)
#   ADMIN_SECRET          — 管理界面登录密码 (可选)
#   GH_TOKEN              — (可选) GitHub PAT, 写入 Pages 供 AI选品按钮触发工作流
#   DEMO_TOKEN            — (可选) 演示用户登录令牌, 多个用逗号分隔
#   LLMAI_APIKEY          — (可选) LLM API Key, 无则用启发式模式
# 各平台联盟 API Secret (AMZ_*/TBK_*/JD_*/GOOGLE_*/PDD_*/DY_*/KS_*/XHS_*)

on:
  schedule:
    # UTC 00:00 = Beijing 08:00 — daily AI selection run
    - cron: '0 0 * * *'
  # 外部触发:AI 选品按钮通过 GitHub API 发送 repository_dispatch 触发本工作流。
  # POST /repos/{owner}/{repo}/dispatches  body: {"event_type":"run-picker","client_payload":{...}}
  repository_dispatch:
    types: [run-picker]
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD, default: today)'
        required: false
        default: ''
      llm_apikey:
        description: 'LLMAI_APIKEY (leave empty to use the repo Secret or heuristic mode)'
        required: false
        default: ''
      use_llm:
        description: 'Use LLM for AI analysis (true|false, default: auto-detect: true if key provided, else false)'
        required: false
        default: ''
      skip_if_exists:
        description: 'Skip regeneration if today data already exists (still deploys + pushes)'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write

concurrency:
  group: affiliate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pick:
    # Only run the picker on schedule, manual dispatch, or external (repository_dispatch) trigger.
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      date: ${{ steps.picker.outputs.date }}
      total: ${{ steps.picker.outputs.total }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node v22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install app deps
        working-directory: .
        run: npm ci --no-audit --no-fund

      - name: Install scripts deps
        working-directory: ./scripts
        run: npm install --no-audit --no-fund

      - name: Typecheck scripts
        working-directory: ./scripts
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit || echo "warn: typecheck skipped (non-blocking)"
          fi

      # Run the AI picker — generates .data/{date}/ + pushes to RECEIVE_URL.
      # 部署在下方直接执行 (不再跨 workflow dispatch)。
      - name: Run AI picker
        working-directory: ./scripts
        id: picker
        env:
          # repository_dispatch 时参数在 client_payload;workflow_dispatch/schedule 时在 inputs
          DISPATCH_DATE: ${{ github.event.client_payload.date }}
          DISPATCH_LLM_KEY: ${{ github.event.client_payload.llm_apikey }}
          DISPATCH_USE_LLM: ${{ github.event.client_payload.use_llm }}
          LLMAI_APIKEY: ${{ github.event.inputs.llm_apikey || secrets.LLMAI_APIKEY }}
          LLMAI_BASE_URL: ${{ secrets.LLMAI_BASE_URL }}
          LLMAI_MODEL: ${{ secrets.LLMAI_MODEL }}
          AMZ_ACCESS_KEY: ${{ secrets.AMZ_ACCESS_KEY }}
          AMZ_SECRET_KEY: ${{ secrets.AMZ_SECRET_KEY }}
          AMZ_PARTNER_TAG: ${{ secrets.AMZ_PARTNER_TAG }}
          AMZ_MARKETPLACE: ${{ secrets.AMZ_MARKETPLACE }}
          AMZ_HOST: ${{ secrets.AMZ_HOST }}
          AMZ_REGION: ${{ secrets.AMZ_REGION }}
          TBK_APP_KEY: ${{ secrets.TBK_APP_KEY }}
          TBK_APP_SECRET: ${{ secrets.TBK_APP_SECRET }}
          TBK_ADZONE_ID: ${{ secrets.TBK_ADZONE_ID }}
          TBK_PID: ${{ secrets.TBK_PID }}
          JD_APP_KEY: ${{ secrets.JD_APP_KEY }}
          JD_APP_SECRET: ${{ secrets.JD_APP_SECRET }}
          JD_ACCESS_TOKEN: ${{ secrets.JD_ACCESS_TOKEN }}
          JD_SITE_ID: ${{ secrets.JD_SITE_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          PDD_CLIENT_ID: ${{ secrets.PDD_CLIENT_ID }}
          PDD_CLIENT_SECRET: ${{ secrets.PDD_CLIENT_SECRET }}
          PDD_PID: ${{ secrets.PDD_PID }}
          DY_APP_KEY: ${{ secrets.DY_APP_KEY }}
          DY_APP_SECRET: ${{ secrets.DY_APP_SECRET }}
          DY_PID: ${{ secrets.DY_PID }}
          KS_APP_KEY: ${{ secrets.KS_APP_KEY }}
          KS_APP_SECRET: ${{ secrets.KS_APP_SECRET }}
          XHS_APP_ID: ${{ secrets.XHS_APP_ID }}
          XHS_APP_SECRET: ${{ secrets.XHS_APP_SECRET }}
          RECEIVE_URL: ${{ secrets.RECEIVE_URL }}
          RECEIVE_TOKEN: ${{ secrets.RECEIVE_TOKEN }}
          # 兼容旧配置: config.ts 优先读 RECEIVE_TOKEN, fallback MATRIX_API_KEY
          MATRIX_API_KEY: ${{ secrets.MATRIX_API_KEY }}
          PICKER_DATE: ${{ github.event.inputs.date || github.event.client_payload.date }}
          MANUAL_LLM_KEY: ${{ github.event.inputs.llm_apikey || github.event.client_payload.llm_apikey }}
          USE_LLM_INPUT: ${{ github.event.inputs.use_llm || github.event.client_payload.use_llm }}
        run: |
          set -euo pipefail
          echo "=== Daily Affiliate AI Picker ==="
          echo "Date: ${PICKER_DATE:-today}"

          # Effective LLM key = manual input (if provided) else the Secret env var
          EFFECTIVE_KEY=""
          if [ -n "${MANUAL_LLM_KEY}" ]; then
            EFFECTIVE_KEY="${MANUAL_LLM_KEY}"
            echo "Using manually-input LLMAI_APIKEY"
          elif [ -n "${LLMAI_APIKEY}" ]; then
            EFFECTIVE_KEY="${LLMAI_APIKEY}"
            echo "Using LLMAI_APIKEY from repo Secrets"
          fi

          # Decide LLM mode: explicit use_llm input > auto-detect from key presence
          if [ -n "${USE_LLM_INPUT}" ]; then
            USE_LLM="${USE_LLM_INPUT}"
          elif [ -n "${EFFECTIVE_KEY}" ]; then
            USE_LLM="true"
          else
            USE_LLM="false"
          fi
          echo "Use LLM: ${USE_LLM}"
          if [ "${USE_LLM}" = "false" ]; then
            echo "WARN: No LLMAI_APIKEY provided — using heuristic mode"
          fi

          ARGS=""
          if [ -n "${PICKER_DATE}" ]; then
            ARGS="${ARGS} --date ${PICKER_DATE}"
          fi
          if [ "${USE_LLM}" = "false" ]; then
            ARGS="${ARGS} --no-llm"
          fi
          # 跳过已存在数据: schedule 定时任务默认跳过(避免当天数据已存在时
          # 重复消耗 LLM quota); 手动触发可通过 skip_if_exists input 显式开启。
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.skip_if_exists }}" = "true" ]; then
            ARGS="${ARGS} --skip-if-exists"
            echo "skip-if-exists: enabled (data already on main will be reused, still pushes + deploys)"
          fi

          echo "Running: tsx src/index.ts ${ARGS}"
          npx tsx src/index.ts ${ARGS}

          TARGET_DATE="${PICKER_DATE:-$(date -u +%F)}"
          SUMMARY_FILE="../.data/${TARGET_DATE}/summary.json"
          if [ ! -f "${SUMMARY_FILE}" ]; then
            echo "ERROR: summary.json not generated at ${SUMMARY_FILE}"
            exit 1
          fi
          echo "summary.json generated"
          TOTAL=$(jq -r '.totalCount // 0' "${SUMMARY_FILE}")
          echo "total=${TOTAL}" >> "$GITHUB_OUTPUT"
          echo "date=${TARGET_DATE}" >> "$GITHUB_OUTPUT"
          echo "Total picks: ${TOTAL}"

      - name: Health check
        working-directory: ./scripts
        run: |
          set -euo pipefail
          TARGET_DATE="${{ steps.picker.outputs.date }}"
          DATA_DIR="../.data/${TARGET_DATE}"
          echo "Health check for ${TARGET_DATE}"
          for f in summary.json amazon.json taobao.json jd.json google.json pdd.json douyin.json kuaishou.json xhs.json; do
            if [ ! -f "${DATA_DIR}/${f}" ]; then
              echo "ERROR: Missing ${f}"
              exit 1
            fi
          done
          for d in by-platform by-category by-commission by-price-range; do
            if [ ! -f "${DATA_DIR}/dimensions/${d}.json" ]; then
              echo "ERROR: Missing dimensions/${d}.json"
              exit 1
            fi
          done
          [ -f "../.data/index.json" ] || { echo "ERROR: index.json missing"; exit 1; }
          jq -r '"Total: \(.totalCount) | AvgScore: \(.avgScore) | Revenue: \(.totalExpectedRevenue)"' "${DATA_DIR}/summary.json"

      # ── 重建 index.json(部署前置步骤) ──
      # 在 commit 之前运行, 确保 main 上也是完整日期列表。
      - name: Rebuild index.json from data dirs
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/rebuild-index.mjs ]; then
            node scripts/rebuild-index.mjs .data
            echo "✓ index.json rebuilt (dates: $(node -e "console.log(require('./.data/index.json').dates.length)") )"
          else
            echo "ℹ️ scripts/rebuild-index.mjs not found — skipping index rebuild"
          fi

      - name: Upload .data artifact
        uses: actions/upload-artifact@v4
        with:
          name: affiliate-data-${{ steps.picker.outputs.date }}
          path: .data/
          retention-days: 90

      # Commit .data/ to main. 部署在同一 job 下方直接执行,
      # 不依赖 push 事件 (GITHUB_TOKEN push 不会触发其他 workflow)。
      - name: Commit .data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .data/
          git commit -m "chore(data): daily pick ${{ steps.picker.outputs.date }} (${{ steps.picker.outputs.total }} items)" || echo "no changes to commit"
          git push || echo "push failed (possibly no changes)"

      # ═══════════════════════════════════════════════════════════════════
      # 以下步骤从 pages-deploy.yml 完整复制(部署到 Cloudflare Pages)。
      # 使用 deploy.config.js 作为配置源, 保证与手动部署完全一致。
      # ═══════════════════════════════════════════════════════════════════

      - name: Install wrangler
        shell: bash
        run: npm install -g wrangler

      - name: Verify required secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN secret."
            exit 1
          fi
          if [ -z "$ENCRYPTION_KEY" ]; then
            echo "::error::Missing ENCRYPTION_KEY secret."
            exit 1
          fi
          echo "✓ Required secrets present."

      - name: Read deploy.config.js
        id: deploy-config
        shell: bash
        run: |
          # 读取 deploy.config.js 配置(ESM 格式)。
          # 一次 import 输出所有字段为 KEY=VALUE 行, 写入 GITHUB_ENV
          node -e "import('./deploy.config.js').then(m => {
            const c = m.default || {};
            const out = {
              PROJECT_NAME: c.projectName || '',
              BUILD_CMD: c.buildCommand || 'npm run build',
              PAGES_BUILD_CMD: c.pagesBuildCommand || '',
              OUTPUT_DIR: c.outputDir || '.vercel/output/static',
              DATA_SRC: (c.dataToPublic && c.dataToPublic.source) || '',
              DATA_TGT: (c.dataToPublic && c.dataToPublic.target) || '',
              REBUILD_INDEX_SCRIPT: c.rebuildIndexScript || '',
              STATIC_EXCLUDE: JSON.stringify(c.staticExclude || []),
              SECRETS_MAP: JSON.stringify(c.secrets || {}),
              RUNTIME_SECRETS: JSON.stringify(c.runtimeSecrets || []),
              D1_NAME: c.d1Name || '',
              KV_NAME: c.kvName || '',
              D1_ID: c.d1Id || '',
              KV_ID: c.kvId || '',
            };
            for (const [k, v] of Object.entries(out)) console.log(k + '=' + v);
          })" >> "$GITHUB_ENV"

          echo "::notice::配置: project=$PROJECT_NAME, output=$(grep '^OUTPUT_DIR=' "$GITHUB_ENV" | tail -1 | cut -d= -f2-)"
          cat "$GITHUB_ENV" | grep -E '^(PROJECT_NAME|BUILD_CMD|OUTPUT_DIR|DATA_SRC|DATA_TGT|D1_NAME|KV_NAME)='

      - name: Validate projectName
        shell: bash
        run: |
          if [ -z "${{ env.PROJECT_NAME }}" ]; then
            echo "::error::deploy.config.js 中 projectName 为空! 请设置 Cloudflare Pages 项目名称。"
            exit 1
          fi
          echo "✅ projectName: ${{ env.PROJECT_NAME }}"

      - name: Resolve Cloudflare Account ID
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          ACCOUNT_ID=$(wrangler whoami 2>/dev/null | grep -oE '[0-9a-f]{32}' | head -1 || echo "")
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::Could not resolve Cloudflare Account ID. Check your API token has the 'User Details: Read' permission."
            exit 1
          fi
          echo "Resolved Account ID: $ACCOUNT_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV

      # ── 数据目录 → public/(可选) ──
      # 把本地数据(如 .data)复制到 public/, 随站点部署为静态文件。
      - name: Copy data to public (deploy data with site)
        if: env.DATA_SRC != '' && env.DATA_TGT != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$DATA_TGT")"
          cp -r "$DATA_SRC/." "$DATA_TGT/"
          echo "✓ Copied $(find "$DATA_TGT" -type f | wc -l) data files from $DATA_SRC to $DATA_TGT/"

      - name: Read build env from deploy.config.js
        id: build-env
        shell: bash
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          # 把 deploy.config.js 的 buildEnv 写入 GITHUB_ENV, 供 Build 步骤注入。
          # deploy.config.js 中的 {GITHUB_REPOSITORY} 占位符会被替换为实际仓库名。
          node -e "import('./deploy.config.js').then(m => {
            const c = m.default || {};
            const envMap = c.buildEnv || {};
            const repo = process.env.GITHUB_REPO || '';
            for (const [k, v] of Object.entries(envMap)) {
              const resolved = String(v).replaceAll('{GITHUB_REPOSITORY}', repo);
              console.log(k + '=' + resolved);
            }
          })" >> "$GITHUB_ENV"
          echo "::notice::buildEnv applied"

      - name: Build project
        shell: bash
        run: |
          if [ -n "$PAGES_BUILD_CMD" ]; then
            $PAGES_BUILD_CMD
          else
            $BUILD_CMD
          fi
        env:
          # 来自 deploy.config.js 的 buildEnv(在 Read build env 步骤写入 GITHUB_ENV)
          NEXT_PUBLIC_GIT_REPO: ${{ env.NEXT_PUBLIC_GIT_REPO }}
          NEXT_PUBLIC_DATA_URL: ${{ env.NEXT_PUBLIC_DATA_URL }}

      # ── 静态路由排除(可选) ──
      # 把 STATIC_EXCLUDE 列表加入 _routes.json 的 exclude, 绕过 worker 直接命中静态文件。
      - name: Route static paths to files (bypass worker)
        if: env.STATIC_EXCLUDE != '[]'
        shell: bash
        run: |
          set -euo pipefail
          ROUTES="$OUTPUT_DIR/_routes.json"
          if [ -f "$ROUTES" ]; then
            EXCLUDES=$(node -e 'const fs=require("fs");const p=process.argv[1];const paths=JSON.parse(process.argv[2]);const d=JSON.parse(fs.readFileSync(p,"utf8"));for(const x of paths){if(!d.exclude.includes(x))d.exclude.push(x);}fs.writeFileSync(p,JSON.stringify(d));console.log("exclude:",d.exclude.join(","));' "$ROUTES" "$STATIC_EXCLUDE")
            echo "✓ $EXCLUDES"
          else
            echo "::warning::_routes.json not found — cannot apply static excludes"
          fi

      - name: Verify build output
        shell: bash
        run: |
          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "::error::Build output $OUTPUT_DIR not found — build failed."
            ls -la "$OUTPUT_DIR" 2>/dev/null || echo "(no output directory at all)"
            exit 1
          fi
          echo "✓ Build output verified: $OUTPUT_DIR"
          ls -la "$OUTPUT_DIR" | head -20

      - name: Create Pages project if not exists
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          set -euo pipefail

          echo "=== Cloudflare auth check (wrangler whoami) ==="
          wrangler whoami 2>&1 || true

          # 用 awk 取项目列表第一列做精确匹配, 避免 grep -qF 子串匹配误判
          if wrangler pages project list 2>&1 | awk -v name="$PROJECT_NAME" '$2 == name { found=1 } END { exit !found }'; then
            echo "Pages project '$PROJECT_NAME' already exists, skipping creation"
          else
            echo "Project '$PROJECT_NAME' does not exist, creating with wrangler..."
            wrangler pages project create "$PROJECT_NAME" --production-branch main
            echo "Created Pages project '$PROJECT_NAME'"

            if wrangler pages project list 2>&1 | awk -v name="$PROJECT_NAME" '$2 == name { found=1 } END { exit !found }'; then
              echo "Verification passed: project '$PROJECT_NAME' now exists"
            else
              echo "::error::wrangler pages project create 执行完毕但项目仍未出现在列表中"
              echo "::error::可能原因: API Token 缺少 Cloudflare Pages:Edit 权限, 或账号 ID 无法解析"
              exit 1
            fi
          fi

      - name: Configure secrets on Pages project
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          set -euo pipefail

          echo "=== Target project: $PROJECT_NAME ==="
          wrangler pages project list 2>&1 | grep -qF "$PROJECT_NAME" || {
            echo "::error::Pages project '$PROJECT_NAME' not found — run 'Create Pages project' step first."
            exit 1
          }

          # ── 业务 secrets (来自 deploy.config.js 的 secrets 映射) ──
          # SECRETS_MAP 格式: JSON 对象 { "WORKFLOW_ENV_NAME": "PAGES_SECRET_NAME" }
          # 从同名 job env 读取值, 写入 Pages。
          echo "$SECRETS_MAP" | node -e '
            const fs = require("fs");
            const map = JSON.parse(fs.readFileSync(0, "utf8"));
            for (const [src, tgt] of Object.entries(map)) {
              console.log(`${src}\t${tgt}`);
            }
          ' | while IFS=$'\t' read -r src tgt; do
            value="${!src:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | wrangler pages secret put "$tgt" --project-name "$PROJECT_NAME"
              echo "✓ secret $tgt written (from $src)"
            else
              echo "ℹ️ secret $src not set — skipped"
            fi
          done

          # ── Cloudflare 运行变量(凭证面板需要) ──
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty — cannot write runtime env."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is empty — cannot write runtime env."
            exit 1
          fi
          printf '%s' "$CLOUDFLARE_API_TOKEN" | wrangler pages secret put CLOUDFLARE_API_TOKEN --project-name "$PROJECT_NAME"
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | wrangler pages secret put CLOUDFLARE_ACCOUNT_ID --project-name "$PROJECT_NAME"
          printf '%s' "$PROJECT_NAME" | wrangler pages secret put CLOUDFLARE_PAGES_PROJECT --project-name "$PROJECT_NAME"

          # ── 可选的 D1 / KV 绑定(wrangler.toml 由 demo 模板驱动) ──
          # 本项目未使用 D1/KV, 如需可参考 scripts/pages-deploy-demo.yml 的 Generate wrangler.toml 步骤。

          echo "✓ Secrets configured"

      - name: Deploy to Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          wrangler pages deploy "$OUTPUT_DIR" --project-name "$PROJECT_NAME" --branch main --commit-dirty

          # Resolve the real *.pages.dev subdomain via the CF API
          PROJECT_DETAILS=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          RAW_SUBDOMAIN=$(echo "$PROJECT_DETAILS" | jq -r '.result.subdomain // empty' | tr -d '\r\n')
          DEPLOY_URL="https://${RAW_SUBDOMAIN:-$PROJECT_NAME}.pages.dev"
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV
          echo "::notice::Deployment URL: $DEPLOY_URL"

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          echo "## Cloudflare Pages 自动部署 ${{ job.status == 'success' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 配置项 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 选品日期 | ${{ steps.picker.outputs.date }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 选品数量 | ${{ steps.picker.outputs.total }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pages 项目 | $PROJECT_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| 输出目录 | $OUTPUT_DIR |" >> $GITHUB_STEP_SUMMARY
          echo "| 触发分支 | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 访问地址 | ${{ env.DEPLOY_URL || '(部署失败)' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Summary
        run: |
          echo "### Daily Affiliate AI Picker Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Date**: ${{ steps.picker.outputs.date }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Total picks**: ${{ steps.picker.outputs.total }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact**: affiliate-data-${{ steps.picker.outputs.date }} (90-day retention)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **RECEIVE_URL**: pushed if configured" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Deploy**: 同 job 内直接部署到 Cloudflare Pages" >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    runs-on: ubuntu-latest
    needs: [pick]
    if: ${{ failure() }}
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily Picker failed — ${date}`,
              body: [
                `The daily affiliate AI picker workflow failed on ${date}.`,
                ``,
                `[View failed run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                ``,
                `**Common causes:**`,
                `- LLM concurrency limit (retry 3s x 10 already configured)`,
                `- Missing GitHub Secrets (LLMAI_APIKEY required for AI mode)`,
                `- Affiliate API credentials expired`,
                `- Cloudflare deploy failure (CLOUDFLARE_API_TOKEN / ENCRYPTION_KEY)`,
                ``,
                `Please check the workflow logs and re-run manually after fixing.`,
              ].join('\n'),
              labels: ['bug', 'auto-generated', 'daily-picker']
            });
